<svg viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle">
  <title id="heroTitle">Ilustrație cu un fotoliu de bărbier și un stâlp barber pole</title>

  <ellipse cx="320" cy="580" rx="260" ry="24" fill="#4C5B5E" opacity="0.18"/>

  <!-- podea / platforma -->
  <rect x="90" y="540" width="460" height="18" rx="4" fill="#4C5B5E" opacity="0.35"/>

  <!-- fotoliu bărbier -->
  <rect x="210" y="380" width="140" height="150" rx="10" fill="#7A2E2E"/>
  <rect x="200" y="370" width="160" height="34" rx="8" fill="#8C3939"/>
  <rect x="230" y="300" width="100" height="90" rx="14" fill="#8C3939"/>
  <rect x="230" y="290" width="100" height="24" rx="10" fill="#7A2E2E"/>

  <!-- baza metalica -->
  <rect x="270" y="530" width="20" height="40" fill="#B4893F"/>
  <ellipse cx="280" cy="572" rx="70" ry="14" fill="#B4893F"/>

  <!-- brate fotoliu -->
  <rect x="185" y="400" width="24" height="110" rx="8" fill="#7A2E2E"/>
  <rect x="351" y="400" width="24" height="110" rx="8" fill="#7A2E2E"/>

  <!-- stalp barber pole -->
  <g>
    <rect x="470" y="140" width="46" height="380" rx="23" fill="#EDE4D0" stroke="#1E211F" stroke-width="3"/>
    <path d="M470 160 L516 200 M470 200 L516 240 M470 240 L516 280
             M470 280 L516 320 M470 320 L516 360 M470 360 L516 400
             M470 400 L516 440 M470 440 L516 480"
          stroke="#7A2E2E" stroke-width="16" stroke-linecap="round"/>
    <path d="M470 180 L516 220 M470 220 L516 260 M470 260 L516 300
             M470 300 L516 340 M470 340 L516 380 M470 380 L516 420
             M470 420 L516 460"
          stroke="#4C5B5E" stroke-width="16" stroke-linecap="round"/>
    <ellipse cx="493" cy="130" rx="28" ry="18" fill="#B4893F"/>
    <ellipse cx="493" cy="530" rx="28" ry="18" fill="#B4893F"/>
  </g>

  <!-- foarfeca stilizata langa fotoliu -->
  <g transform="translate(120,440) rotate(-25)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#B4893F" stroke-width="6"/>
    <circle cx="0" cy="34" r="14" fill="none" stroke="#B4893F" stroke-width="6"/>
    <path d="M10 8 L70 -50" stroke="#EDE4D0" stroke-width="6" stroke-linecap="round"/>
    <path d="M10 26 L70 84" stroke="#EDE4D0" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
